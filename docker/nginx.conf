# Nginx-configuratie voor de web-app (T19.1).
#
# Twee dingen die er echt toe doen:
#  1. **SPA-fallback.** De app doet client-side routing (`/tablet`, `/operator`, `/verify-email`).
#     Zonder `try_files … /index.html` geeft een harde refresh op zo'n pad een 404 — precies wat een
#     begeleider doet als hij een link opnieuw opent.
#  2. **Cachebeleid.** De gehashte bundels mogen lang gecachet worden, `index.html` juist niet:
#     anders blijft een browser na een update de oude bundelnamen opvragen.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Geen serverversie prijsgeven.
    server_tokens off;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
