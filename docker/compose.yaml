# Intento in Docker (fase 19). Alles wat bij de containers hoort staat in `docker/`; zie
# `docker/README.md`. Starten en stoppen:
#
#   docker/start.sh        # maakt bij de eerste keer `.env.docker` met verse geheimen, bouwt en start
#   docker/stop.sh
#
# Met de hand kan ook — geef dan altijd `--env-file` mee, anders mist Compose zijn variabelen:
#
#   docker compose -f docker/compose.yaml --env-file docker/.env.docker up -d --build
#
# Paden hieronder zijn relatief aan deze map: de build-context `..` is de repo-root, en `dockerfile`
# is relatief aan die context.
#
# Vier onderdelen, elk een eigen image: de backend, de web-app, de spraakdienst en de agentdienst
# (ADR-0017). Spraak- en agentdienst hebben geen poort naar buiten; alleen de backend praat ermee.
#
# De database is bewust **SQLite op een volume** (ADR-0016): het schema, de migratielijn en de
# runtime-adapter zijn nu SQLite, en die overstap hoort een eigen, zichtbare taak te zijn.

name: intento

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    env_file: [.env.docker]
    environment:
      # De database en de afbeeldingen staan op de volumes hieronder, niet in het image.
      DATABASE_URL: file:/data/intento.db
      STORAGE_DIR: /storage
      # NODE_ENV komt bewust uit `.env.docker` en staat hier niet vast. Het image draait standaard op
      # `production`, en dan eist de prod-guard in `env.ts` terecht https, echte secrets, een SMTP-URL
      # en `COOKIE_SECURE=true`. Voor een lokale http://localhost-stack zet je hem in `.env.docker` op
      # `development`; zodra er TLS voor staat, zet je hem terug op `production` en vul je de rest in.
      # De spraakdienst is binnen het compose-netwerk bereikbaar op zijn servicenaam.
      SPEECH_PROVIDER: http
      SPEECH_SERVICE_URL: http://speech:5002
      # De agentdienst, ook op zijn servicenaam. Plain http mag hier: hij publiceert geen poort en
      # weigert alles zonder het gedeelde geheim.
      AGENT_SERVICE_URL: http://agents:5003
      AGENT_SERVICE_TOKEN: '${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN ontbreekt in docker/.env.docker}'
      AGENT_ALLOW_INSECURE_HTTP: 'true'
      AGENT_TIMEOUT_MS: '${AGENT_TIMEOUT_MS:-30000}'
    volumes:
      - intento-db:/data
      - intento-storage:/storage
    depends_on:
      # De startset van de Vocabulary staat er pas als de importklus klaar is.
      vocabulary-import:
        condition: service_completed_successfully
    ports:
      # De API krijgt een eigen poort: de web-app kan hem niet delen (route `/operator` botst met de
      # API-tak `/operator/*`). Zie ADR-0016.
      - '${SERVER_PORT:-3000}:3000'
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # Vite bakt deze URL in de bundel: dit is de API-URL zoals de **browser** hem ziet, niet zoals
        # de containers elkaar zien. Wijzig je hem, dan hoort daar `--build` bij.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # --- Spraakuitvoer (T19.2) ---------------------------------------------------------------------
  # Eenmalige klus die de stemmodellen in het volume zet. Draait bij elke `up` heel even, ziet dat de
  # bestanden er al staan en stopt meteen; alleen de eerste keer (of na een nieuwe stem in de lijst)
  # downloadt hij echt. Zo staat de stemkeuze in `.env.docker` en niet in een image.
  speech-voices:
    build:
      context: ../speech-service
      dockerfile: ../docker/speech.Dockerfile
    user: root
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        python -m piper.download_voices --data-dir /voices ${SPEECH_VOICES:-nl_NL-pim-medium nl_NL-alex-medium nl_NL-ronnie-medium nl_BE-nathalie-medium}
        && chown -R 1000:1000 /voices
    volumes:
      - intento-voices:/voices
    restart: 'no'

  speech:
    build:
      context: ../speech-service
      dockerfile: ../docker/speech.Dockerfile
    env_file: [.env.docker]
    environment:
      # Binnen het compose-netwerk moet hij wél op alle interfaces luisteren; daarom is het gedeelde
      # geheim hier geen luxe maar voorwaarde (zie speech-service/README.md).
      HOST: 0.0.0.0
      VOICES_DIR: /voices
      SERVICE_TOKEN: '${SPEECH_SERVICE_TOKEN:?SPEECH_SERVICE_TOKEN ontbreekt in docker/.env.docker}'
    volumes:
      - intento-voices:/voices
    depends_on:
      speech-voices:
        condition: service_completed_successfully
    # Bewust géén `ports:` — alleen de backend hoort erbij te kunnen, niet de host of het netwerk.
    restart: unless-stopped

  # --- Startset van de Vocabulary (N2.8) -----------------------------------------------------------
  # Eenmalige klus, net als `speech-voices`: migreert, downloadt de afbeeldingen van Mulberry en de
  # zorgsymbolen naar het opslagvolume en seedt de Vocabulary. Bij een volgende `up` ziet hij dat de
  # afbeeldingen er al staan en maakt hij niets dubbel. Na een nieuwe vertaling: `docker/start.sh`
  # opnieuw (alleen deze klus: `docker compose -f docker/compose.yaml --env-file docker/.env.docker run
  # --rm --build vocabulary-import`).
  vocabulary-import:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    env_file: [.env.docker]
    environment:
      DATABASE_URL: file:/data/intento.db
      STORAGE_DIR: /storage
    command: ['node', 'dist/scripts/vocabulary-import.js']
    # Het image erft de HEALTHCHECK van de backend (`/health` op poort 3000), maar deze klus draait geen
    # server. Zonder dit staat hij tijdens de import op "unhealthy" en ziet `start.sh` (`up --wait`) dat
    # als mislukt.
    healthcheck:
      disable: true
    volumes:
      - intento-db:/data
      - intento-storage:/storage
    restart: 'no'

  # --- Agentdienst (N1.7) -------------------------------------------------------------------------
  agents:
    build:
      context: ../agent-service
      dockerfile: ../docker/agents.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: '5003'
      # Verplicht: de dienst start niet zonder, en de backend stuurt dezelfde waarde mee.
      SERVICE_TOKEN: '${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN ontbreekt in docker/.env.docker}'
      # Het taalmodel (§35). Leeg = alleen de regelgebaseerde agents.
      OLLAMA_URL: '${OLLAMA_URL:-}'
      OLLAMA_MODEL: '${OLLAMA_MODEL:-}'
      OLLAMA_API_KEY: '${OLLAMA_API_KEY:-}'
      AGENT_PROPOSE_THRESHOLD: '${AGENT_PROPOSE_THRESHOLD:-0.85}'
      AGENT_LLM_VALIDATION: '${AGENT_LLM_VALIDATION:-false}'
      AGENT_LLM_SAFETY: '${AGENT_LLM_SAFETY:-false}'
      AGENT_TURN_BUDGET_SECONDS: '${AGENT_TURN_BUDGET_SECONDS:-25}'
    # Bewust géén `ports:` — alleen de backend hoort erbij te kunnen.
    restart: unless-stopped

volumes:
  intento-db:
  intento-storage:
  intento-voices:
